x-enigma-common:
  &enigma-common
  build:
    context: .
    args:
      USERNAME: $USER
      UID: ${USER_ID:-0}
      GID: ${GROUP_ID:-0}
  volumes:
    - .:/app
    - enigma-gems:/gems
    - /app/node_modules
  stdin_open: true # docker run -i
  tty: true        # docker run -t
  environment:
    DB_DEV: enigma-development
    DB_HOST: db
    DB_TEST: enigma-test
    DB_USERNAME: postgres
    GOOGLE_API_KEY: ${GOOGLE_API_KEY}
    REDIS_URL: redis://redis:6379
    XERO_ID: ${XERO_ID}
    XERO_SECRET: ${XERO_SECRET}


services:
  web:
    << : *enigma-common
    command: "./script/start-dev.sh"
    ports:
      - "3000:3000"
    depends_on:
      - db

  db:
    image: postgres:11.5
    volumes:
      - enigma-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  enigma-data:
  enigma-gems:
